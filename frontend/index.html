<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8C1D4F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CareBook</title>
    <script>
      // Apply the saved or OS theme before first paint (no light flash in dark mode). See src/lib/theme.ts.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('carebook-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A1215')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
